services:
  asspp:
    image: ghcr.io/lakr233/assppweb:latest
    ports:
      - "8080:8080"
    volumes:
      - ./mnt/asspp-data:/data
    environment:
      - DATA_DIR=/data
      - PORT=8080
      # - DOWNLOAD_THREADS=8
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-}
      # Optional private R2 storage (requires an image built with R2 support).
      - R2_BUCKET=${R2_BUCKET:-}
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_MAX_STORAGE_MB=${R2_MAX_STORAGE_MB:-3072}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-}
      # With R2: default max file 2048 MB, one active download; both must be > 0.
      # - MAX_DOWNLOAD_MB=2048
      # - MAX_ACTIVE_DOWNLOADS=1
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "128m"
        max-file: "5"
